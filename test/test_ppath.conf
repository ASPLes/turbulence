<?xml version='1.0' ?><!-- great emacs, please load -*- nxml -*- mode -->
<!-- Configuration used by the turbulence-ppath.c regression tests.

     It declares a <path-def> without any <allow>/<if-success> child,
     which is accepted by turbulence-config.dtd:

        <!ELEMENT path-def (search | if-success | allow)*>

     turbulence_ppath_init only allocates definition->ppath_items when
     at least one <allow>/<if-success> child is found, so this
     <path-def> ends up with a NULL items array that
     turbulence_ppath_cleanup used to dereference. -->
<turbulence>

  <global-settings>
    <ports>
      <port>44010</port>
    </ports>

    <listener>
      <name>0.0.0.0</name>
    </listener>

    <log-reporting enabled="no">
      <general-log file="/var/log/turbulence/main.log" />
      <error-log  file="/var/log/turbulence/error.log" />
      <access-log file="/var/log/turbulence/access.log" />
      <vortex-log file="/var/log/turbulence/vortex.log" />
    </log-reporting>

    <tls-support enabled="no" />

    <on-bad-signal action="hold" />

    <clean-start value="no" />

    <connections>
      <max-connections hard-limit="512" soft-limit="512"/>
    </connections>

    <kill-childs-on-exit value="yes" />

    <allow-start-without-profiles value="yes" />
  </global-settings>

  <modules>
    <no-load>
      <module name="mod-skipped" />
    </no-load>
  </modules>

  <profile-path-configuration>

    <!-- a regular profile path, with items -->
    <path-def server-name=".*" src=".*" path-name="ppath-reg-test-with-items">
      <allow profile="urn:aspl.es:beep:profiles:reg-test:base" />
    </path-def>

    <!-- a profile path declaring no <allow>/<if-success> child at all -->
    <path-def src="192.0.2.1" path-name="ppath-reg-test-no-items" />

    <!-- a profile path declaring only a <search> child, which is not
         an <allow>/<if-success> either -->
    <path-def src="192.0.2.2" path-name="ppath-reg-test-only-search">
      <search domain="reg-test" path="." />
    </path-def>

  </profile-path-configuration>

</turbulence>
